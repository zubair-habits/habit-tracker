<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!--
    Content Security Policy (CLAUDE.md section 8).
    Everything loads only from this app; no connections to other websites.
    'unsafe-inline' styles and data: fonts/images are allowed only because the
    Eruda debug console needs them. None of these can run code or send data out.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="theme-color" content="#2e7d5b">
  <meta name="color-scheme" content="light dark">
  <title>Habit Tracker</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <script src="./js/theme-boot.js"></script>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <button id="update-banner" class="update-banner" type="button" hidden>
    Update available, tap to reload
  </button>

  <header class="app-header">
    <button id="home-button" class="home-button" type="button">Habit Tracker</button>
    <button id="menu-button" class="menu-button" type="button" aria-label="Menu" aria-haspopup="true" aria-expanded="false" aria-controls="menu">
      <span></span><span></span><span></span>
    </button>
    <nav id="menu" class="menu" hidden>
      <button type="button" data-go="settings">Settings</button>
      <button type="button" data-go="analysis">Analysis</button>
      <button type="button" data-go="export">Export</button>
    </nav>
  </header>

  <main class="app-main">
    <section data-view="main">
      <div class="card">
        <h2>Calendar</h2>
        <p class="placeholder">The calendar arrives in Module 3</p>
      </div>
    </section>

    <section data-view="settings" hidden>
      <div class="card">
        <h2>Theme</h2>
        <fieldset class="choice">
          <legend class="visually-hidden">Theme</legend>
          <label><input type="radio" name="theme" value="system"> System</label>
          <label><input type="radio" name="theme" value="light"> Light</label>
          <label><input type="radio" name="theme" value="dark"> Dark</label>
        </fieldset>
      </div>

      <div class="card">
        <h2>About</h2>
        <dl class="about">
          <dt>App version</dt>
          <dd id="about-version">…</dd>
          <dt>Schema version</dt>
          <dd id="about-schema">…</dd>
          <dt>Persistent storage</dt>
          <dd id="about-persist">…</dd>
          <dt>Habits</dt>
          <dd id="about-habits">…</dd>
          <dt>Completions</dt>
          <dd id="about-completions">…</dd>
          <dt>Settings</dt>
          <dd id="about-settings">…</dd>
        </dl>
      </div>
    </section>

    <section data-view="analysis" hidden>
      <div class="card">
        <h2>Analysis</h2>
        <p class="placeholder">Coming in Module 5</p>
      </div>
    </section>

    <section data-view="export" hidden>
      <div class="card">
        <h2>Export</h2>
        <p class="placeholder">Coming in Module 4</p>
      </div>
    </section>
  </main>
</body>
</html>
